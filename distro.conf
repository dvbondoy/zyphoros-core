# Build settings shared by every edition (shell syntax, sourced by
# tools/build-iso.sh, auto/config and tools/boot-test.py).
#
# The distro's name and version are not here: they are shipped on the system
# in packages/DISTRO_ID-branding/usr/lib/DISTRO_ID-release.

# Package prefix (DISTRO_ID-base, DISTRO_ID-branding, ...) and os-release VARIANT_ID.
DISTRO_ID=zyphoros

# Debian release everything is built from. Only trixie (Debian 13) is tested.
SUITE=trixie
MIRROR=http://deb.debian.org/debian/
ARCHIVE_AREAS="main contrib non-free non-free-firmware"

# Live session. live-config's password for the live user is "live".
LIVE_USER=user
LIVE_HOSTNAME=zyphoros
