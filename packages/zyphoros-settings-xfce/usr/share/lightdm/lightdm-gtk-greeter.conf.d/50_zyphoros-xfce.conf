# Zyphor OS XFCE login screen (zyphoros-settings-xfce), after Debian's
# 01_debian.conf, which shows desktop-base's login background. Change these in
# /etc/lightdm/lightdm-gtk-greeter.conf, which is read last.
[greeter]
theme-name=Greybird
icon-theme-name=elementary-xfce
font-name=Noto Sans 10
xft-hintstyle=hintslight
default-user-image=#zyphoros-logo
clock-format=%a %d %b, %H:%M
indicators=~host;~spacer;~clock;~spacer;~language;~session;~a11y;~power
