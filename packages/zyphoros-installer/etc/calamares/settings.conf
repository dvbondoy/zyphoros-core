# Calamares settings for Zyphor OS (zyphoros-installer), adapted from Debian's
# calamares-settings-debian. The steps between "exec" entries run in order;
# shellprocess@NAME runs etc/calamares/modules/shellprocess-NAME.conf.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       dpkg-unsafe-io
  module:   shellprocess
  config:   shellprocess-dpkg-unsafe-io.conf
- id:       dpkg-unsafe-io-undo
  module:   shellprocess
  config:   shellprocess-dpkg-unsafe-io-undo.conf
- id:       sources-media
  module:   shellprocess
  config:   shellprocess-sources-media.conf
- id:       sources-media-unmount
  module:   shellprocess
  config:   shellprocess-sources-media-unmount.conf
- id:       bootloader-packages
  module:   shellprocess
  config:   shellprocess-bootloader-packages.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - shellprocess@dpkg-unsafe-io
  - shellprocess@sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@bootloader-packages
  - grubcfg
  - bootloader
  - packages
  - initramfscfg
  - initramfs
  - shellprocess@dpkg-unsafe-io-undo
  - shellprocess@sources-media-unmount
  - umount
- show:
  - finished

branding: zyphoros
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
