# Edition: a console system with no desktop.
# Every desktops/NAME/desktop.conf sets these (shell syntax).

# Shown in the ISO label.
DESKTOP_NAME="Minimal"

# The edition's meta-package is DISTRO_ID-META. The image installs it, its
# Depends, and the Recommends of every DISTRO_ID-* package it brings in.
META=base

# yes: add the Calamares installer (installer/config/). It needs a desktop.
INSTALLER=no

# Kernel options for the live boot, after "boot=live components".
BOOT_OPTIONS="quiet"

# Packages the sanity hook insists on, in addition to the common ones.
REQUIRED=""

# The boot test checks that the display manager service (DISPLAY_MANAGER, if
# set) runs and that the live user was logged in automatically: these
# programs run as the live user (none: a shell on tty1).
DISPLAY_MANAGER=""
SESSION_PROCESSES=""
