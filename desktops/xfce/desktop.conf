# Edition: the Xfce desktop with the LightDM login screen and the Calamares
# installer. See desktops/minimal/desktop.conf for what each setting means.

DESKTOP_NAME="Xfce"
META=desktop-xfce

# Add the installer (installer/config/): Calamares, the "Install" launcher
# and the bootloader packages in the ISO's pool.
INSTALLER=yes

BOOT_OPTIONS="quiet"

REQUIRED="xserver-xorg xfce4-session lightdm lightdm-gtk-greeter zyphoros-settings-xfce zyphoros-artwork"

# The boot test checks that this service runs and that the live user was
# logged in automatically: these programs run as the live user.
DISPLAY_MANAGER=lightdm
SESSION_PROCESSES="xfce4-session xfce4-panel xfdesktop"
